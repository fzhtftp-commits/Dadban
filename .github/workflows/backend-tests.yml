name: Dadban Backend Tests

on:
  push:
    branches:
      - security/rls-rollout-plan
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend tests
        run: |
          npm install
          npm test
