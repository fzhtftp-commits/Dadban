name: Form validation tests
on:
  pull_request:
    branches: [main]
  push:
    branches: ["audit/forms-inventory-2026-10"]
permissions:
  contents: read
jobs:
  form-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test backend/tests/forms-validation.test.cjs
