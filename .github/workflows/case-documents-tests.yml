name: Case document metadata checks
on:
  push:
    branches:
      - feature/case-documents-metadata
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dadban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dadban_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: node --check src/server.js && node --check ../documents.js
        working-directory: backend
      - name: Verify metadata migration and office isolation in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d dadban_test -v ON_ERROR_STOP=1 -f tests/case-documents-isolation.sql
        working-directory: backend
